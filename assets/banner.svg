<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .d1 { animation: blink 2.8s ease-in-out infinite; }
      .d2 { animation: blink 2.8s ease-in-out infinite 0.35s; }
      .d3 { animation: blink 2.8s ease-in-out infinite 0.7s; }
      .d4 { animation: blink 2.8s ease-in-out infinite 1.05s; }
      .d5 { animation: blink 2.8s ease-in-out infinite 1.4s; }
      .d6 { animation: blink 2.8s ease-in-out infinite 1.75s; }
      .divline { animation: pulse 3.5s ease-in-out infinite; }
      .nameglow { animation: glow 4s ease-in-out infinite; }
      .toptag { animation: tagslide 4s ease-in-out infinite; }
      @keyframes blink {
        0%, 100% { opacity: 0.07; }
        50% { opacity: 0.38; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.55; }
      }
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 3px rgba(88,166,255,0.25)); }
        50% { filter: drop-shadow(0 0 12px rgba(88,166,255,0.55)); }
      }
      @keyframes tagslide {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.85; }
      }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="45%" stop-color="#0F1E35"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E6EDF3"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#79C0FF"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="25%" stop-color="#58A6FF"/>
      <stop offset="75%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="900" height="1.5" fill="url(#lineGrad)" opacity="0.75"/>

  <!-- Left dot grid -->
  <circle class="d1" cx="22" cy="32" r="1.4" fill="#58A6FF"/>
  <circle class="d2" cx="52" cy="32" r="1.4" fill="#58A6FF"/>
  <circle class="d3" cx="82" cy="32" r="1.4" fill="#58A6FF"/>
  <circle class="d4" cx="112" cy="32" r="1.3" fill="#58A6FF"/>
  <circle class="d5" cx="142" cy="32" r="1.1" fill="#58A6FF"/>

  <circle class="d2" cx="22" cy="62" r="1.4" fill="#58A6FF"/>
  <circle class="d3" cx="52" cy="62" r="1.4" fill="#58A6FF"/>
  <circle class="d4" cx="82" cy="62" r="1.4" fill="#58A6FF"/>
  <circle class="d5" cx="112" cy="62" r="1.2" fill="#58A6FF"/>
  <circle class="d6" cx="142" cy="62" r="1.0" fill="#58A6FF"/>

  <circle class="d3" cx="22" cy="92" r="1.4" fill="#58A6FF"/>
  <circle class="d4" cx="52" cy="92" r="1.4" fill="#58A6FF"/>
  <circle class="d5" cx="82" cy="92" r="1.2" fill="#58A6FF"/>
  <circle class="d6" cx="112" cy="92" r="1.0" fill="#58A6FF"/>

  <circle class="d4" cx="22" cy="122" r="1.4" fill="#58A6FF"/>
  <circle class="d5" cx="52" cy="122" r="1.2" fill="#58A6FF"/>
  <circle class="d6" cx="82" cy="122" r="0.9" fill="#58A6FF"/>

  <circle class="d5" cx="22" cy="152" r="1.2" fill="#58A6FF"/>
  <circle class="d6" cx="52" cy="152" r="1.0" fill="#58A6FF"/>

  <circle class="d6" cx="22" cy="178" r="1.0" fill="#58A6FF"/>

  <!-- Right dot grid (mirror) -->
  <circle class="d1" cx="878" cy="32" r="1.4" fill="#58A6FF"/>
  <circle class="d2" cx="848" cy="32" r="1.4" fill="#58A6FF"/>
  <circle class="d3" cx="818" cy="32" r="1.4" fill="#58A6FF"/>
  <circle class="d4" cx="788" cy="32" r="1.3" fill="#58A6FF"/>
  <circle class="d5" cx="758" cy="32" r="1.1" fill="#58A6FF"/>

  <circle class="d2" cx="878" cy="62" r="1.4" fill="#58A6FF"/>
  <circle class="d3" cx="848" cy="62" r="1.4" fill="#58A6FF"/>
  <circle class="d4" cx="818" cy="62" r="1.4" fill="#58A6FF"/>
  <circle class="d5" cx="788" cy="62" r="1.2" fill="#58A6FF"/>
  <circle class="d6" cx="758" cy="62" r="1.0" fill="#58A6FF"/>

  <circle class="d3" cx="878" cy="92" r="1.4" fill="#58A6FF"/>
  <circle class="d4" cx="848" cy="92" r="1.4" fill="#58A6FF"/>
  <circle class="d5" cx="818" cy="92" r="1.2" fill="#58A6FF"/>
  <circle class="d6" cx="788" cy="92" r="1.0" fill="#58A6FF"/>

  <circle class="d4" cx="878" cy="122" r="1.4" fill="#58A6FF"/>
  <circle class="d5" cx="848" cy="122" r="1.2" fill="#58A6FF"/>
  <circle class="d6" cx="818" cy="122" r="0.9" fill="#58A6FF"/>

  <circle class="d5" cx="878" cy="152" r="1.2" fill="#58A6FF"/>
  <circle class="d6" cx="848" cy="152" r="1.0" fill="#58A6FF"/>

  <circle class="d6" cx="878" cy="178" r="1.0" fill="#58A6FF"/>

  <!-- Name -->
  <text class="nameglow" x="450" y="95" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="46" font-weight="700"
    fill="url(#nameGrad)">Muhammad Subhan</text>

  <!-- Role -->
  <text x="450" y="130" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="15.5" fill="#58A6FF" opacity="0.88">
    SAP BTP Developer  ·  Full-Stack Engineer  ·  AWS  ·  Data Pipelines
  </text>

  <!-- Separator -->
  <rect class="divline" x="175" y="148" width="550" height="0.7" fill="url(#lineGrad)"/>

  <!-- Tech keywords -->
  <text x="450" y="172" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="10" fill="#8B949E" letter-spacing="2.5">
    JOULE  ·  CAP  ·  INTEGRATION SUITE  ·  REACT  ·  PYTHON  ·  AWS CDK
  </text>

  <!-- Bottom accent line -->
  <rect x="0" y="198.5" width="900" height="1.5" fill="url(#lineGrad)" opacity="0.75"/>
</svg>
